# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/apiops-cli/v1.0.5/schemas/v1/override-config.schema.json
# EXAMPLES ONLY. Not used by any pipeline.
# Copy the entries you need into configuration.<env>.yaml (dev, test1, test2, prod).
#
# Format rules:
#   - `name` is the APIM resource name: the folder name under apim-artifacts/<type>/.
#   - `properties` holds the ARM properties to replace. Keys are case-sensitive.
#   - Dictionaries are merged into the extracted values; lists and scalar values replace them.
#   - The resource must also be listed in configuration.extractor.yaml.
#   - Secrets: Key Vault-backed named values only. Never put a secret value in these files.

backends:
  # Backend URL per environment.
  - name: orders-backend
    properties:
      url: "https://orders-api.test1.contoso.com"

  # Backend that points at an Azure resource (App Service, Function App, Logic App).
  # Value: Azure portal > the resource > Properties > Resource ID, prefixed with https://management.azure.com
  - name: orders-function-backend
    properties:
      url: "https://func-orders-test1.azurewebsites.net/api"
      resourceId: "https://management.azure.com/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-orders-test1/providers/Microsoft.Web/sites/func-orders-test1"

  # Backend credentials. Header values, authorization parameters and the query parameters
  # code, sig and subscription-key must be {{named-value}} references (Test-Ownership.ps1 rejects literals).
  # Required in EVERY environment file (dev included) when the extracted
  # apim-artifacts/backends/<name>/backendInformation.json contains null under properties.credentials,
  # for example "query": { "api-version": null }. Otherwise the null is published.
  - name: orders-function-backend-with-key
    properties:
      credentials:
        header:
          x-functions-key:
            - "{{orders-function-key}}"     # named value defined below (Key Vault-backed)
        query:
          api-version:
            - "2024-01-01"

  # Basic or bearer authorization on a backend.
  - name: partner-backend
    properties:
      credentials:
        authorization:
          scheme: Basic
          parameter: "{{partner-basic-credentials}}"

namedValues:
  # Plain (non-secret) value.
  - name: orders-timeout-seconds
    properties:
      value: "30"

  # Key Vault secret read with APIM's SYSTEM-assigned managed identity: omit identityClientId.
  # secretIdentifier: Azure portal > Key vault > Secrets > <secret> > copy "Secret Identifier",
  # then remove the trailing /<version> so APIM always reads the latest version.
  # Format: https://<vault-name>.vault.azure.net/secrets/<secret-name>
  - name: orders-function-key
    properties:
      displayName: orders-function-key
      secret: true
      keyVault:
        secretIdentifier: "https://kv-orders-test1.vault.azure.net/secrets/orders-function-key"

  # Key Vault secret read with a USER-assigned managed identity attached to APIM.
  # identityClientId: Azure portal > Managed Identities > <identity> > Overview > Client ID.
  - name: partner-basic-credentials
    properties:
      displayName: partner-basic-credentials
      secret: true
      keyVault:
        secretIdentifier: "https://kv-orders-test1.vault.azure.net/secrets/partner-basic-credentials"
        identityClientId: "11111111-1111-1111-1111-111111111111"

apis:
  - name: orders-api
    # Only for APIs that set their URL directly instead of using a backend (<set-backend-service>).
    properties:
      serviceUrl: "https://orders-api.test1.contoso.com/v1"
    # API-level diagnostic that writes to an environment-specific logger.
    # loggerId: ARM ID of the logger in the target APIM. List them with:
    #   az rest --method get --query "value[].id" --url "https://management.azure.com/subscriptions/<sub-id>/resourceGroups/<rg>/providers/Microsoft.ApiManagement/service/<apim>/loggers?api-version=2022-08-01"
    diagnostics:
      - name: applicationinsights
        properties:
          loggerId: "/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-apim-test1/providers/Microsoft.ApiManagement/service/apim-test1/loggers/appinsights-test1"

products:
  # Only for products listed in configuration.extractor.yaml (products we own).
  - name: orders-product
    properties:
      subscriptionRequired: true
      approvalRequired: true

policyFragments:
  - name: orders-auth-fragment
    properties:
      description: "Orders authentication"

versionSets:
  - name: orders-version-set
    properties:
      displayName: "Orders API"
