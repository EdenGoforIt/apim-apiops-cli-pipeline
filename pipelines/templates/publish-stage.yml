# Publish stage for one environment (Azure DevOps environment: apim-<environment>).
# planStage: true adds a dry-run stage before the publish stage, so it runs before the environment approval.
parameters:
  - name: environment
    type: string
  - name: dependsOn
    type: string
  - name: planStage
    type: boolean
    default: false

stages:
  - ${{ if parameters.planStage }}:
      - stage: Plan_${{ parameters.environment }}
        displayName: Dry-run ${{ parameters.environment }}
        dependsOn: ${{ parameters.dependsOn }}
        condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
        variables:
          - template: ../variables/${{ parameters.environment }}.yml
        jobs:
          - job: DryRun
            steps:
              - template: publish-steps.yml
                parameters:
                  environment: ${{ parameters.environment }}
                  serviceConnection: ${{ variables.serviceConnection }}
                  dryRunOnly: true

  - stage: Publish_${{ parameters.environment }}
    displayName: Publish ${{ parameters.environment }}
    ${{ if parameters.planStage }}:
      dependsOn: Plan_${{ parameters.environment }}
    ${{ else }}:
      dependsOn: ${{ parameters.dependsOn }}
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    variables:
      - template: ../variables/${{ parameters.environment }}.yml
    jobs:
      - deployment: Publish
        environment: apim-${{ parameters.environment }}
        strategy:
          runOnce:
            deploy:
              steps:
                - template: publish-steps.yml
                  parameters:
                    environment: ${{ parameters.environment }}
                    serviceConnection: ${{ variables.serviceConnection }}
