# test2 environment. Non-secret values only.
# serviceConnection and devOpsEnvironment must be set here: Azure DevOps resolves them at compile time.
variables:
  - name: serviceConnection
    value: REPLACE-ME-test2-service-connection
  - name: apimResourceGroup
    value: REPLACE-ME-test2-resource-group
  - name: apimServiceName
    value: REPLACE-ME-test2-apim-name
  - name: devOpsEnvironment
    value: REPLACE-ME-test2-devops-environment
